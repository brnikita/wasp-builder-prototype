services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wasp_builder
      POSTGRES_PASSWORD: wasp_builder_pass
      POSTGRES_DB: wasp_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasp_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wasp_builder:wasp_builder_pass@db:5432/wasp_builder
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-x-ai/grok-code-fast-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./generated_apps:/app/generated_apps
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

